{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav>
        <div class="links">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'grocery' %}">Grocery</a>
        <a href="{% url 'fashion' %}">Fashion</a>
        <a href="{% url 'electronics' %}">Electronics</a>
        <a href="{% url 'healthcare' %}">HealthCare</a>
        </div>
    </nav>
    <h1>Grocery Page</h1>
    <div class="grocery-container">
        <div class="grocery-item">
          
          <img src="{% static 'images/fruits.jpg' %}" alt="fruits">
          <b>Fruits</b>
          <p><b>price:</b>250/kg</p>
        </div>
         <div class="grocery-item">
           <img src="{% static 'images/chocolates.jpeg' %}" alt="chocolates">
           <b>Dairy-chocolates</b>
           <p><b>price:</b>1500/-</p>
        </div>
         <div class="grocery-item">
            <img src="{% static 'images/Essentials.jpeg' %}" alt="Essentials">
           <b>Essentials</b>
           <p><b>price:</b>1 kg-700/-</p>
        </div>
           <div class="grocery-item">
                <img src="{% static 'images/vegetables.jpg' %}" alt="vegetables">
                <b>vegetables</b>
                <p><b>price:</b>1 kg-500/-</p>
            </div> 
                <div class="grocery-item">   
                 <img src="{% static 'images/grains.jpg' %}" alt="grains">
                 <b>Grains</b>
                 <p><b>price:</b>1 kg-600/-</p>
                </div>
     </div>
     
</body>
</html>
